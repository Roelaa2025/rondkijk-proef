<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rondkijk-proef</title>
<style>
  :root { --bg:#0b0d10; --fg:#f2efe8; --muted:#9aa0a6; --accent:#f2a900; color-scheme: dark; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
         padding: calc(8px + env(safe-area-inset-top,0px)) 16px 8px; background:linear-gradient(rgba(11,13,16,.85), rgba(11,13,16,0)); pointer-events:none; }
  #bar h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.02em; }
  #bar .hint { color:var(--muted); }
  #bar button { pointer-events:auto; background:rgba(255,255,255,.08); color:var(--fg); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 12px; font:inherit; cursor:pointer; }
  #bar button[aria-pressed="true"] { background:var(--accent); color:#1a1200; border-color:var(--accent); }
  #bar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a-scene { position:fixed; inset:0; }
</style>
</head>
<body>


<div id="bar">
  <h1>Supermarkt-entree, rondkijk-proef</h1>
  <button id="b1" type="button" aria-pressed="true">1 Entree</button>
  <button id="b2" type="button" aria-pressed="false">2 Koelmeubel</button>
  <button id="motion" type="button" hidden>Bewegingssensor aanzetten</button>
  <span class="hint" id="hint">Sleep of draai je telefoon. Tik op de oranje stip om verder te lopen; bij het meubel: tik op de greep (in de bril: pak hem met je hand).</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
<a-scene background="color: #0b0d10" vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: false" renderer="colorManagement: true; antialias: true"
         webxr="referenceSpaceType: local; requiredFeatures: local; optionalFeatures: hand-tracking, local-floor">
  <a-assets>
    <img id="p1" src="pano_test_1.jpg" crossorigin="anonymous">
    <img id="p2" src="opendeur_test_2.jpg" crossorigin="anonymous">
    <video id="walk" src="walk_test_3.mp4" preload="auto" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>

  <!-- Beeld is ~200° breed en ~85° hoog: een deel van de bol, gecentreerd recht vooruit (-z). -->
  <a-entity id="pano"
    geometry="primitive: sphere; radius: 50; segmentsWidth: 96; segmentsHeight: 48; phiStart: 170; phiLength: 200; thetaStart: 47.5; thetaLength: 85"
    material="shader: flat; side: back; src: #p1; repeat: -1 1; offset: 1 0"></a-entity>

  <!-- Scène 2, koelmeubel met echte KnapVers-bakjes: stereo-360 uit Blender (blender/koelmeubel.py),
       boven = linkeroog, onder = rechteroog, transparant buiten het meubel. Ligt óver de foto. -->
  <a-entity id="meubel" visible="false" stereo-laag="src: koelmeubel_stereo.png; radius: 40"></a-entity>

  <!-- Loopclip: vlak recht vooruit, alleen zichtbaar tijdens de overgang -->
  <a-plane id="walkplane" visible="false" position="0 0 -6" width="10.7" height="6"
           material="shader: flat; src: #walk; opacity: 0"></a-plane>

  <!-- Zwarte bol dicht om de camera voor het in- en uitfaden -->
  <a-sphere id="fader" radius="0.5" material="shader: flat; color: #000; side: back; opacity: 0; transparent: true; depthWrite: false"></a-sphere>

  <!-- Scène 1: stip bij de saladewand -> loop naar scène 2 -->
  <a-entity id="hs1" position="1.6 0.4 -9.6">
    <a-ring color="#f2a900" radius-inner="0.18" radius-outer="0.26" material="shader: flat; opacity: .9" class="clickable" data-go="2"
            animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-ring>
    <a-circle color="#f2a900" radius="0.1" material="shader: flat" class="clickable" data-go="2"></a-circle>
    <a-circle radius="0.8" material="shader: flat; opacity: 0.001; transparent: true; depthWrite: false" class="clickable" data-go="2"></a-circle>
  </a-entity>

  <!-- Scène 2: labels boven de drie zones + stip om terug te lopen (links, richting de kratten) -->
  <a-entity id="s2" visible="false">
    <!-- Labels rechts naast het meubel, op schaphoogte -->
    <a-plane class="label" data-label="INNOVATIE" position="0.86 0.30 -1.5"  rotation="0 -10 0" width="0.46" height="0.115" material="shader: flat; transparent: true"></a-plane>
    <a-plane class="label" data-label="SEIZOEN"   position="0.86 -0.18 -1.5" rotation="0 -10 0" width="0.46" height="0.115" material="shader: flat; transparent: true"></a-plane>
    <a-plane class="label" data-label="BASIS"     position="0.86 -0.72 -1.5" rotation="0 -10 0" width="0.46" height="0.115" material="shader: flat; transparent: true"></a-plane>

    <!-- 3D-deur: scharnier links (x=-0.43), opening 0,87 x 1,81 m op 1,48 m afstand, middenhoogte -0,20 -->
    <a-entity id="deur" position="-0.43 -0.20 -1.48" rotation="0 0 0">
      <a-entity position="0.435 0 0">
        <a-plane width="0.87" height="1.81"
                 material="shader: flat; color: #dfe9f0; opacity: 0.16; transparent: true; side: double; depthWrite: false"></a-plane>
        <a-plane width="0.87" height="1.81" position="0 0 -0.002"
                 material="shader: flat; color: #ffffff; opacity: 0.06; transparent: true; side: double; depthWrite: false"></a-plane>
        <a-box position="0 0.905 0" width="0.87" height="0.03" depth="0.035" color="#b9bcc0" material="shader: flat"></a-box>
        <a-box position="0 -0.905 0" width="0.87" height="0.03" depth="0.035" color="#b9bcc0" material="shader: flat"></a-box>
        <a-box position="-0.42 0 0" width="0.03" height="1.81" depth="0.035" color="#b9bcc0" material="shader: flat"></a-box>
        <a-box position="0.42 0 0" width="0.03" height="1.81" depth="0.035" color="#b9bcc0" material="shader: flat"></a-box>
        <!-- greep rechts, met tikvlak -->
        <a-cylinder class="clickable" data-action="deur" position="0.36 0 0.05" radius="0.014" height="0.34" color="#e6e6e6" material="shader: flat"></a-cylinder>
        <a-box position="0.36 0.15 0.025" width="0.02" height="0.02" depth="0.05" color="#e6e6e6" material="shader: flat"></a-box>
        <a-box position="0.36 -0.15 0.025" width="0.02" height="0.02" depth="0.05" color="#e6e6e6" material="shader: flat"></a-box>
        <a-plane class="clickable" data-action="deur" position="0.36 0 0.06" width="0.16" height="0.5" material="shader: flat; opacity: 0.001; transparent: true; depthWrite: false"></a-plane>
      </a-entity>
    </a-entity>
    <a-entity position="-8.5 -0.6 -3.5">
      <a-ring color="#f2a900" radius-inner="0.18" radius-outer="0.26" material="shader: flat; opacity: .9" class="clickable" data-go="1"
              animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-ring>
      <a-circle color="#f2a900" radius="0.1" material="shader: flat" class="clickable" data-go="1"></a-circle>
      <a-circle radius="0.8" material="shader: flat; opacity: 0.001; transparent: true; depthWrite: false" class="clickable" data-go="1"></a-circle>
    </a-entity>
  </a-entity>

  <!-- Quest: eigen handen (hand tracking) en, als de controllers worden gepakt, een laser met trigger -->
  <a-entity id="handL" hand-tracking-controls="hand: left; modelStyle: mesh; modelColor: #e9cfae"></a-entity>
  <a-entity id="handR" hand-tracking-controls="hand: right; modelStyle: mesh; modelColor: #e9cfae"></a-entity>
  <a-entity laser-controls="hand: left"  raycaster="objects: .clickable; far: 6" line="color: #f2a900; opacity: 0.6"></a-entity>
  <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 6" line="color: #f2a900; opacity: 0.6"></a-entity>

  <a-entity camera look-controls="reverseMouseDrag: true" position="0 0 0">
    <!-- Blik-cursor: alleen actief in de bril (zie enter-vr/exit-vr); in 2D doet de tik-straal het werk -->
    <a-cursor id="gaze" fuse="false" fuse-timeout="1200" color="#f2a900" raycaster="objects: .geen" visible="false"
              animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.4 0.4 0.4; dur: 1200"
              animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150"></a-cursor>
  </a-entity>
</a-scene>

<script>
  // Stereo-laag: één boven-onder-afbeelding (links boven, rechts onder) op een bol om de kijker.
  // In de bril ziet elk oog zijn eigen helft (three.js: linkeroog laag 1, rechteroog laag 2);
  // op een scherm zie je het linkeroog. Blender +Y (beeldmidden) = A-Frame -Z.
  AFRAME.registerComponent('stereo-laag', {
    schema: { src: { type: 'string' }, radius: { type: 'number', default: 40 } },
    init: function () {
      var el = this.el, data = this.data, self = this;
      new THREE.TextureLoader().load(data.src, function (tex) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter;
        self.meshes = [0, 1].map(function (oog) {
          var t = oog === 0 ? tex : tex.clone();
          t.repeat.set(-1, 0.5);                 // gespiegeld (van binnen bekeken) en één helft
          t.offset.set(1, oog === 0 ? 0.5 : 0);   // boven = links, onder = rechts
          t.needsUpdate = true;
          var geo = new THREE.SphereGeometry(data.radius, 96, 48, THREE.MathUtils.degToRad(90), Math.PI * 2);
          var mat = new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, transparent: true, depthWrite: false });
          var m = new THREE.Mesh(geo, mat);
          m.layers.set(oog + 1);
          m.renderOrder = 1;
          el.setObject3D('oog' + oog, m);
          return m;
        });
      });
      // Buiten de bril rendert de gewone camera alleen laag 0: zet daar het linkeroog bij.
      var cam = document.querySelector('[camera]');
      var zet = function () { var c = cam.getObject3D('camera'); if (c) c.layers.enable(1); };
      if (cam.getObject3D('camera')) zet(); else cam.addEventListener('loaded', zet);
    }
  });

  (function () {
    var current = 1, busy = false;
    var pano = document.getElementById('pano'), fader = document.getElementById('fader');
    var plane = document.getElementById('walkplane'), video = document.getElementById('walk');
    var hs1 = document.getElementById('hs1'), s2 = document.getElementById('s2');
    var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');

    function fade(to, ms) {
      return new Promise(function (res) {
        fader.removeAttribute('animation__fade');
        fader.setAttribute('animation__fade', { property: 'material.opacity', to: to, dur: ms, easing: 'linear' });
        setTimeout(res, ms + 30);
      });
    }
    function setScene(n) {
      current = n;
      pano.setAttribute('material', 'src', '#p' + n);
      hs1.setAttribute('visible', n === 1);
      if (n === 1 && deurOpen) toggleDeur();
      s2.setAttribute('visible', n === 2);
      document.getElementById('meubel').setAttribute('visible', n === 2);
      b1.setAttribute('aria-pressed', String(n === 1));
      b2.setAttribute('aria-pressed', String(n === 2));
    }
    function playWalk() {
      return new Promise(function (res) {
        var done = function () { video.removeEventListener('ended', done); res(); };
        video.addEventListener('ended', done);
        try { video.currentTime = 0; } catch (e) { /* nog geen metadata: gewoon vanaf het begin spelen */ }
        plane.setAttribute('visible', true);
        plane.setAttribute('material', 'opacity', 1);
        var p = video.play();
        if (p && p.catch) p.catch(function () { done(); });   // kan de clip niet starten: sla hem over
        setTimeout(done, 8000);                                 // vangnet
      });
    }
    async function go(n) {
      if (busy || n === current) return;
      busy = true;
      try {
        await fade(1, 350);
        if (n === 2) {                       // vooruit: met loopclip
          pano.setAttribute('visible', false);
          await fade(0, 250);
          await playWalk();
          await fade(1, 250);
        }
      } catch (e) { /* clip mislukt: dan zonder overgang door */ }
      plane.setAttribute('visible', false);
      plane.setAttribute('material', 'opacity', 0);
      pano.setAttribute('visible', true);
      setScene(n);
      await fade(0, 450);
      busy = false;
    }
    // Labels als canvas-textuur: geen extern lettertype nodig.
    document.querySelectorAll('.label').forEach(function (el, i) {
      var c = document.createElement('canvas'); c.width = 1024; c.height = 256;
      var g = c.getContext('2d');
      g.fillStyle = 'rgba(11,13,16,.72)'; g.beginPath(); g.roundRect(0, 0, 1024, 256, 48); g.fill();
      g.fillStyle = '#f2a900'; g.fillRect(0, 216, 1024, 12);
      g.fillStyle = '#f2efe8'; g.font = '600 120px system-ui, Segoe UI, Arial, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(el.getAttribute('data-label'), 512, 118);
      var apply = function () { el.setAttribute('material', 'src', c.toDataURL('image/png')); };
      if (el.hasLoaded) apply(); else el.addEventListener('loaded', apply);
    });

    b1.addEventListener('click', function () { go(1); });
    b2.addEventListener('click', function () { go(2); });
    var deur = document.getElementById('deur'), deurOpen = false, deurLaatst = 0;
    function toggleDeur() {
      var nu = Date.now(); if (nu - deurLaatst < 900) return; deurLaatst = nu;   // één tik = één zwaai
      deurOpen = !deurOpen;
      deur.removeAttribute('animation__zwaai');
      deur.setAttribute('animation__zwaai', { property: 'rotation', to: deurOpen ? '0 -105 0' : '0 0 0', dur: 800, easing: deurOpen ? 'easeOutCubic' : 'easeInOutCubic' });
    }
    function act(el) {
      if (el.getAttribute('data-action') === 'deur') toggleDeur();
      else go(Number(el.getAttribute('data-go')));
    }
    document.querySelectorAll('.clickable').forEach(function (el) {
      el.addEventListener('click', function () { act(el); });   // gaze-cursor (bril)
    });

    // Hand tracking (Quest): knijpen vlak bij de greep, of de greep met een vingertop aanraken.
    var greep = document.querySelector('#deur a-cylinder'), greepPos = new THREE.Vector3();
    function bijGreep(p, afstand) { greep.object3D.getWorldPosition(greepPos); return p.distanceTo(greepPos) < afstand; }
    ['handL', 'handR'].forEach(function (id) {
      var h = document.getElementById(id);
      h.addEventListener('pinchstarted', function (e) { if (e.detail && e.detail.position && bijGreep(e.detail.position, 0.18)) toggleDeur(); });
    });
    if (!AFRAME.components['greep-aanraking']) {
      AFRAME.registerComponent('greep-aanraking', {
        init: function () { this.binnen = { handL: false, handR: false }; },
        tick: function () {
          var self = this;
          ['handL', 'handR'].forEach(function (id) {
            var c = document.getElementById(id).components['hand-tracking-controls'];
            if (!c || !c.indexTipPosition) return;
            var raak = bijGreep(c.indexTipPosition, 0.07);
            if (raak && !self.binnen[id]) toggleDeur();      // pas opnieuw na weggaan en terugkomen
            self.binnen[id] = raak;
          });
        }
      });
    }
    document.querySelector('a-scene').setAttribute('greep-aanraking', '');

    // Tikken/klikken op een stip: eigen straal van de camera door het tikpunt (telefoon + desktop).
    var scene = document.querySelector('a-scene'), down = null, gaze = document.getElementById('gaze');
    scene.addEventListener('enter-vr', function () { gaze.setAttribute('visible', true); gaze.setAttribute('cursor', 'fuse', true); gaze.setAttribute('raycaster', 'objects', '.clickable'); });
    scene.addEventListener('exit-vr',  function () { gaze.setAttribute('visible', false); gaze.setAttribute('cursor', 'fuse', false); gaze.setAttribute('raycaster', 'objects', '.geen'); });
    var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    scene.addEventListener('loaded', function () {
      var canvas = scene.canvas;
      canvas.addEventListener('pointerdown', function (e) { down = [e.clientX, e.clientY]; });
      canvas.addEventListener('pointerup', function (e) {
        if (!down) return;
        var moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
        if (moved > 10) return;                                   // dat was slepen, geen tik
        var r = canvas.getBoundingClientRect();
        ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        ray.setFromCamera(ndc, scene.camera);
        var targets = [];
        document.querySelectorAll('.clickable').forEach(function (el) {
          var m = el.getObject3D('mesh'); if (m && el.object3D.visible && el.parentNode.object3D.visible) targets.push(m);
        });
        var hits = ray.intersectObjects(targets, false);
        if (!hits.length) return;
        act(hits[0].object.el);
      });
    });

    // iOS geeft de gyroscoop pas vrij na een tik; Android meestal meteen.
    var motion = document.getElementById('motion'), hint = document.getElementById('hint');
    var needsAsk = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function' && ('ontouchstart' in window);
    if (needsAsk) {
      motion.hidden = false;
      motion.addEventListener('click', function () {
        DeviceOrientationEvent.requestPermission().then(function (state) {
          if (state === 'granted') { motion.hidden = true; hint.textContent = 'Draai je telefoon om rond te kijken.'; }
          else { hint.textContent = 'Geen toestemming voor de bewegingssensor; slepen werkt wel.'; }
        }).catch(function () { hint.textContent = 'Bewegingssensor niet beschikbaar; slepen werkt wel.'; });
      });
    }
  })();
</script>

</body>
</html>
